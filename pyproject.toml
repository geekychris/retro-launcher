[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-launcher"
version = "1.0.0"
description = "Full-screen launcher for the Amiga 68k, AmigaOS 4, Atari ST/Falcon and 3DO emulators"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pygame-ce>=2.4", "tomli>=1.1; python_version < '3.11'"]

[project.scripts]
retro-launcher = "retro_launcher.__main__:main"

[tool.setuptools]
packages = ["retro_launcher"]

[tool.setuptools.package-data]
retro_launcher = ["assets/*.png", "assets/*.ico", "assets/*.icns", "assets/*/*.png"]
